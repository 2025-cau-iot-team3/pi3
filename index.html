<!DOCTYPE html>
<html>
<head>
    <title>Pi 1 로봇 뷰어</title>
    <style>
        /* 전체 화면 꽉 채우기 및 스타일 정리 */
        body { 
            font-family: sans-serif; 
            background: #000; 
            margin: 0; 
            padding: 0;
            overflow: hidden; /* 스크롤바 제거 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }
        
        /* 비디오 스타일: 화면에 꽉 차게 비율 유지 */
        video { 
            max-width: 100%; 
            max-height: 100%; 
            background: black; 
        }

        /* 상태 메시지를 작게 표시 (필요 없으면 display: none 처리 가능) */
        #status { 
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em; 
            pointer-events: none; /* 클릭 방해 안 함 */
        }
    </style>
</head>
<body>
    <div id="status">상태: 연결 대기 중...</div>

    <video id="video" autoplay playsinline></video>

    <script>
        // --- 1. Pi 1 서버의 IP 주소 (환경에 맞게 수정 필수) ---
        const PI_1_IP = "192.168.0.22"; 
        const URI = `ws://${PI_1_IP}:8000`;
        // ----------------------------------------------------

        const videoElement = document.getElementById('video');
        const statusElement = document.getElementById('status');
        let websocket;
        let pc;

        async function connect() {
            statusElement.textContent = `서버 (${URI}) 연결 중...`;
            
            websocket = new WebSocket(URI);
            
            websocket.onopen = () => {
                statusElement.textContent = "서버 연결됨. 영상 요청 중...";
                startWebRTC();
            };

            websocket.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                
                if (data.command === "video_answer") {
                    statusElement.textContent = "영상 신호 수신. 연결 중...";
                    try {
                        const answer = new RTCSessionDescription(data.payload);
                        await pc.setRemoteDescription(answer);
                        statusElement.textContent = "영상 연결 완료!"; // 잠시 후 사라지게 할 수도 있음
                    } catch (e) {
                        statusElement.textContent = `연결 에러: ${e}`;
                    }
                }
            };

            websocket.onclose = () => {
                statusElement.textContent = "서버 연결 끊어짐. 3초 후 재연결...";
                // 연결이 끊어지면 3초 뒤 재시도 (키오스크 모드에 유용)
                if (pc) pc.close();
                setTimeout(connect, 3000);
            };

            websocket.onerror = (err) => {
                statusElement.textContent = "연결 오류 발생";
                websocket.close();
            };
        }

        async function startWebRTC() {
            if (pc) pc.close();
            
            pc = new RTCPeerConnection({
                iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
            });

            // 트랙 수신 설정 (비디오/오디오)
            pc.addTransceiver("video", { direction: "recvonly" });
            pc.addTransceiver("audio", { direction: "recvonly" });

            pc.ontrack = (event) => {
                console.log(`스트림(${event.track.kind}) 수신`);
                if (event.streams && event.streams[0]) {
                    videoElement.srcObject = event.streams[0];
                }
            };

            // Offer 생성 및 전송
            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // ICE Candidate 수집 대기
                await new Promise((resolve) => {
                    if (pc.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        pc.onicegatheringstatechange = () => {
                            if (pc.iceGatheringState === 'complete') {
                                resolve();
                            }
                        };
                    }
                });

                const offerCommand = {
                    source: "pc_web_viewer",
                    command: "video_offer",
                    payload: { sdp: pc.localDescription.sdp, type: pc.localDescription.type }
                };
                websocket.send(JSON.stringify(offerCommand));
                
            } catch (e) {
                statusElement.textContent = `WebRTC 설정 에러: ${e}`;
            }
        }

        // 페이지 로드 시 자동 연결
        window.onload = connect;
    </script>
</body>
</html>
